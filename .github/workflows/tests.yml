name: tests

# Runs the suite a reader runs locally, on the interpreter this repository was
# verified on. Python 3.11 is not a preference: requirements.txt pins libraries
# whose wheels stop at cp311, so a newer runner cannot install them at all.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is a test-time tool, not a dependency of the deliverables, so it
          # is deliberately not in requirements.txt. Pinned anyway: an unpinned
          # runner is a non-reproducible runner.
          pip install pytest==9.1.1

      - name: Run the test suite
        run: python -m pytest -q

  # Separate job, separate environment, on purpose. chainladder needs numpy 2
  # and requirements.txt pins numpy 1.26.4 so matplotlib 3.6.2 can render the
  # committed charts; in one environment matplotlib stops importing entirely.
  # Running the cross-check here means it is actually executed rather than
  # skipped, which is the only way a skip stays honest.
  crosscheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the cross-check environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crosscheck.txt
          pip install pytest==9.1.1

      - name: Cross-check the reserving engine against chainladder
        run: python -m pytest -q tests/test_reserving_crosscheck.py
